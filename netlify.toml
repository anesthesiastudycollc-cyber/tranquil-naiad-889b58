[build]
  publish = "."
  # Two steps, in this order.
  #
  # `links:check` fails the build if a page links to a section or a file that is
  # not there. It exists because the landing page once shipped with its "Browse
  # Mind Maps" and Amazon buttons pointing at sections an edit had deleted: the
  # HTML was still valid, the deploy was still green, and the buttons did nothing.
  #
  # `previews:deploy` then replaces the mind map artwork with blurred, watermarked
  # previews before the site is deployed. The originals stay untouched in git;
  # only the protected versions are ever published. See scripts/build-previews.mjs.
  command = "npm run links:check && npm run previews:deploy"

[functions]
  directory = "netlify/functions"

# The full-resolution mind map artwork lives in `assets/mind-maps/`, which the
# site publishes, so every file in it used to be one guessable URL away from being
# downloaded for free — the blur on the gallery was a CSS filter applied after the
# sharp image had already reached the browser.
#
# This rewrite serves the blurred, watermarked derivative from `assets/previews/`
# whenever the original path is requested, so the untouched artwork is no longer
# reachable over HTTP. It is a rewrite rather than a redirect so that listing
# images already published elsewhere under the old URL keep working — they simply
# start returning the protected version. `force` is required: without it Netlify
# serves the static file that exists at this path and ignores the rule.
#
# It also fails safe: a file with no generated preview 404s here rather than
# falling through to the original, so forgetting to regenerate cannot leak art.
[[redirects]]
  from = "/assets/mind-maps/*"
  to = "/assets/previews/:splat"
  status = 200
  force = true

# Backwards-compatibility deep link: old /study-guides bookmarks land on the store
# category anchor. Having this redirect avoids depending on search engines or
# old emails that might point to /study-guides.
[[redirects]]
  from = "/study-guides"
  to = "/store.html#study-guides"
  status = 301
  force = true

# Both derivative folders only change when artwork is regenerated, and there is
# nothing sensitive left in them, so they are safe to sit in browser caches.
[[headers]]
  for = "/assets/previews/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/assets/listing-images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
